<!doctype html>
<html lang="ko" style="color-scheme: only light; background:#fff;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- 기기가 다크모드여도 항상 라이트로 고정 (강제 다크 반전 차단) -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Nanum+Gothic:wght@400;700&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo&family=Do+Hyeon&family=Gamja+Flower&family=Hi+Melody&family=Poor+Story&family=Yeon+Sung&family=Caveat:wght@400;700&family=Patrick+Hand&family=Playfair+Display:wght@500;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
    <title>timejig</title>
  </head>
  <body style="background:#fff; color:#222;">
    <div id="root"></div>
    <script>
      // 흰 화면 자동 복구 — 옛 캐시가 새 파일(JS/CSS)을 못 찾으면 캐시·서비스워커를 비우고 1회 새로고침
      (function () {
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (!t) return;
          var url = t.src || t.href || '';
          var isScript = t.tagName === 'SCRIPT';
          var isStyle = t.tagName === 'LINK' && t.rel === 'stylesheet';
          if (!isScript && !isStyle) return;
          if (url.indexOf(location.origin) !== 0) return; // 외부(구글 폰트 등) 실패는 무시
          if (sessionStorage.getItem('tj-recovered')) return; // 무한 새로고침 방지
          sessionStorage.setItem('tj-recovered', '1');
          var done = function () { location.reload(); };
          var clearCaches = (window.caches && caches.keys)
            ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
            : Promise.resolve();
          clearCaches.then(function () {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              return navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              });
            }
          }).then(done, done);
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
